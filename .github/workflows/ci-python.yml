name: Build and test Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  linting:
    name: Linting
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python and check with ruff
        uses: greenbone/actions/lint-python@v3
        with:
          packages: greenbone
          package-manager: uv
          linter: ruff check
          formatter: ruff format
          python-version: ${{ matrix.python-version }}

  test:
    name: Run all tests
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python and uv
        uses: greenbone/actions/uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run python -m unittest

  coverage:
    name: Upload coverage
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python and upload coverage
        uses: greenbone/actions/coverage-python@v3
        with:
          python-version: ${{ matrix.python-version }}
          package-manager: uv
          token: ${{ secrets.CODECOV_TOKEN }}

  mypy:
    name: Check type hints
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install python and uv
        uses: greenbone/actions/uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run mypy
        run: uv run mypy
